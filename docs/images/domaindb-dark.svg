<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="domaindb: system, context and types in; domain databases out">
  <style>
    .box   { fill: #161b22; stroke: #e6edf3; stroke-width: 2; }
    .core  { fill: #0c2d4a; stroke: #58a6ff; stroke-width: 2.5; }
    .label { fill: #e6edf3; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; }
    .core-label { fill: #58a6ff; font-weight: 700; }
    .arrow { stroke: #8b949e; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- inputs -->
  <rect class="box" x="12"  y="20"  width="120" height="30" rx="4"/>
  <text class="label" x="72"  y="39" text-anchor="middle">system  *.ral</text>
  <rect class="box" x="12"  y="85"  width="120" height="30" rx="4"/>
  <text class="label" x="72"  y="104" text-anchor="middle">context  *.sip</text>
  <rect class="box" x="12"  y="150" width="120" height="30" rx="4"/>
  <text class="label" x="72"  y="169" text-anchor="middle">types  *.yaml</text>

  <!-- arrows in -->
  <path class="arrow" marker-end="url(#ah-d)" d="M132,35  H186"/>
  <path class="arrow" marker-end="url(#ah-d)" d="M132,100 H186"/>
  <path class="arrow" marker-end="url(#ah-d)" d="M132,165 H186"/>

  <!-- core -->
  <rect class="core" x="190" y="70" width="100" height="60" rx="8"/>
  <text class="label core-label" x="240" y="105" text-anchor="middle">domaindb</text>

  <!-- arrows out -->
  <path class="arrow" marker-end="url(#ah-d)" d="M290,90  H348"/>
  <path class="arrow" marker-end="url(#ah-d)" d="M290,110 H348"/>

  <!-- outputs -->
  <rect class="box" x="352" y="70"  width="116" height="30" rx="4"/>
  <text class="label" x="410" y="89"  text-anchor="middle">&lt;domain&gt;.ral</text>
  <rect class="box" x="352" y="112" width="116" height="30" rx="4"/>
  <text class="label" x="410" y="131" text-anchor="middle">&lt;domain&gt;.txt</text>
</svg>